<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบตั้งชื่อไฟล์และบันทึกประวัติ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    input, button { padding: 8px 12px; font-size: 14px; }
    ul { background: #f4f4f4; padding: 20px 40px; border-radius: 8px; max-width: 400px; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h2>ระบบตั้งชื่อไฟล์ (เว็บเปิด)</h2>
  
  <input type="text" id="fileNameInput" placeholder="พิมพ์ชื่อไฟล์ที่นี่...">
  <button onclick="saveFileName()">บันทึกชื่อไฟล์</button>
  <button onclick="clearHistory()">ล้างประวัติ</button>

  <h3>ประวัติการตั้งชื่อไฟล์:</h3>
  <ul id="historyList"></ul>

  <script>
    // 1. โหลดประวัติเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", displayHistory);

    function saveFileName() {
      const input = document.getElementById("fileNameInput");
      const fileName = input.value.trim();

      if (!fileName) {
        alert("กรุณากรอกชื่อไฟล์ก่อนครับ");
        return;
      }

      // 2. ดึงประวัติเดิมออกมาจาก LocalStorage (ถ้าไม่มีให้ใช้ array เปล่า)
      let history = JSON.parse(localStorage.getItem("fileHistory")) || [];

      // 3. ใส่ชื่อไฟล์ใหม่ลงไปด้านหน้าสุดของ Array
      history.unshift({
        name: fileName,
        time: new Date().toLocaleString("th-TH")
      });

      // 4. บันทึกกลับลง LocalStorage (แปลงเป็น JSON String)
      localStorage.setItem("fileHistory", JSON.stringify(history));

      // 5. เคลียร์ช่อง input และอัปเดตการแสดงผล
      input.value = "";
      displayHistory();
    }

    function displayHistory() {
      const historyList = document.getElementById("historyList");
      historyList.innerHTML = "";

      // ดึงข้อมูลมาแสดงผล
      let history = JSON.parse(localStorage.getItem("fileHistory")) || [];

      if (history.length === 0) {
        historyList.innerHTML = "<li>ยังไม่มีประวัติการบันทึก</li>";
        return;
      }

      history.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} (บันทึกเมื่อ: ${item.time})`;
        historyList.appendChild(li);
      });
    }

    function clearHistory() {
      // ลบข้อมูลเฉพาะคีย์ fileHistory ออกจาก LocalStorage
      localStorage.removeItem("fileHistory");
      displayHistory();
    }
  </script>

</body>
</html>
